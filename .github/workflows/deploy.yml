name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, v4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm quartz build
        env:
          # Canonical URL for sitemap/RSS/OG. Set this in the repository
          # secrets/variables to your real domain.
          NLAB_SITE_URL: ${{ vars.NLAB_SITE_URL || 'nlab-chinese.github.io' }}
          NLAB_OG_IMAGES: ${{ vars.NLAB_OG_IMAGES || '0' }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
