name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts/cli.py
      - name: Pytest
        run: pytest

  quartz:
    name: Quartz (typecheck + format + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck + prettier
        run: pnpm check
      - name: Quartz tests
        run: pnpm test
      - name: Build
        run: pnpm quartz build
        env:
          NLAB_OG_IMAGES: "0"
