name: CI

on:
  push:
    branches: [main, master, v4]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (lint + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: python -m ruff check src tests scripts/cli.py scripts/check_content.py scripts/check_docs.py
      - name: Pytest
        run: python -m pytest
      - name: Content provenance and structure audit
        run: python scripts/check_content.py
      - name: Documentation audit
        run: python scripts/check_docs.py

  quartz:
    name: Quartz (typecheck + format + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck + prettier
        run: pnpm check
      - name: Quartz tests
        run: pnpm test
      - name: Build
        run: pnpm quartz build
        env:
          NLAB_SITE_URL: nlab-chinese.github.io
          NLAB_OG_IMAGES: "0"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag nlab-chinese:test .
