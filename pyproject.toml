[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlab-pipeline"
version = "1.0.0"
description = "nLab-Chinese: 自动化中英对照翻译流水线（扫描/状态库/结构化翻译/校验/发布）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nLab-Chinese contributors" }]
dependencies = [
    "requests>=2.31,<3",
    "urllib3>=2.0,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
nlab-pipeline = "nlab_pipeline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # allow direct function calls in CLI add_argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
